[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv,venv,build,dist

[tool:pytest]
testpaths = tests
addopts = -q

[coverage:run]
branch = True
source = service
omit = service/__init__.py

[coverage:report]
show_missing = True
fail_under = 80

[pylint]
max-line-length = 100
disable = C0114,C0115,C0116
